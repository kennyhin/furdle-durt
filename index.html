<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>furdle durt — organic rock</title>
    <meta
      name="description"
      content="furdle durt — organic rock. Music, gallery, and merch."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/gallery/logo-circle.png" type="image/png" />
  </head>
  <body>
    <main class="hero" id="top">
      <div class="hero__content">
        <p class="hero__eyebrow">organic rock</p>
        <h1 class="hero__title">
          <span>furdle</span>
          <span>durt</span>
        </h1>

        <button
          type="button"
          class="plant-btn"
          id="plant-btn"
          aria-haspopup="dialog"
          aria-controls="site-modal"
          aria-label="Water the plant to open music, gallery, and merch"
          aria-describedby="water-hint"
        >
          <span class="plant-btn__scene" aria-hidden="true">
            <span class="plant-btn__can">
              <!-- Galvanized metal watering can: spout + perforated rose head point left (toward the pot) -->
              <svg viewBox="0 0 80 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="fd-can-body" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#4f565c" />
                    <stop offset=".14" stop-color="#8d969d" />
                    <stop offset=".3" stop-color="#d3dadf" />
                    <stop offset=".37" stop-color="#f5f8fa" />
                    <stop offset=".48" stop-color="#b3bbc1" />
                    <stop offset=".78" stop-color="#788188" />
                    <stop offset="1" stop-color="#454b50" />
                  </linearGradient>
                  <linearGradient id="fd-can-top" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#e3e8ec" />
                    <stop offset=".55" stop-color="#a7b0b6" />
                    <stop offset="1" stop-color="#6c757c" />
                  </linearGradient>
                  <linearGradient id="fd-can-spout" gradientUnits="userSpaceOnUse" x1="24.2" y1="37.9" x2="27.9" y2="33.1">
                    <stop offset="0" stop-color="#474d52" />
                    <stop offset=".45" stop-color="#a9b2b8" />
                    <stop offset=".72" stop-color="#eef2f4" />
                    <stop offset="1" stop-color="#7d868c" />
                  </linearGradient>
                  <linearGradient id="fd-can-rose" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#4a5055" />
                    <stop offset=".4" stop-color="#dfe5e9" />
                    <stop offset="1" stop-color="#5d656b" />
                  </linearGradient>
                </defs>
                <!-- long tapered spout -->
                <path d="M39.2 41.2Q26.5 32.5 14.3 24.4L12.5 26.6Q24 36.5 34.8 46.8Z" fill="url(#fd-can-spout)" stroke="#33393d" stroke-width=".5" />
                <!-- rose (sprinkler) head -->
                <g transform="translate(8 24.3) rotate(-77)">
                  <path d="M-1.7 6.2L1.7 6.2L5.3.6L-5.3.6Z" fill="url(#fd-can-rose)" stroke="#33393d" stroke-width=".4" />
                  <ellipse rx="5.5" ry="2" fill="#3a4044" stroke="#dce3e7" stroke-width=".7" />
                  <g fill="#121517">
                    <circle cx="-3.6" r=".42" /><circle cx="-1.8" cy="-.7" r=".42" /><circle r=".42" /><circle cx="1.8" cy="-.7" r=".42" /><circle cx="3.6" r=".42" /><circle cx="-1.8" cy=".7" r=".42" /><circle cx="1.8" cy=".7" r=".42" />
                  </g>
                </g>
                <!-- rear handle -->
                <path d="M72 22C79.5 23 79.5 37 72 38" stroke="#2f3438" stroke-width="3.4" stroke-linecap="round" />
                <path d="M72 22C79.5 23 79.5 37 72 38" stroke="#a5aeb4" stroke-width="2" stroke-linecap="round" />
                <path d="M74.6 25.5C76.6 28 76.6 32 75 34.5" stroke="#eef2f4" stroke-width=".6" stroke-linecap="round" />
                <!-- body -->
                <path d="M36 18V49A18 4.5 0 0 0 72 49V18Z" fill="url(#fd-can-body)" stroke="#33393d" stroke-width=".6" />
                <path d="M36 45.5V49A18 4.5 0 0 0 72 49V45.5A18 4.5 0 0 1 36 45.5Z" fill="#1b1f22" opacity=".25" />
                <path d="M36 25A18 4.5 0 0 0 72 25M36 45.5A18 4.5 0 0 0 72 45.5" stroke="#3a4044" stroke-width=".6" opacity=".7" />
                <path d="M36 25.8A18 4.5 0 0 0 72 25.8M36 46.3A18 4.5 0 0 0 72 46.3" stroke="#f2f5f7" stroke-width=".5" opacity=".55" />
                <path d="M66.5 22.5V52.9" stroke="#2b3034" stroke-width=".5" opacity=".35" />
                <rect x="44.6" y="23" width="1.6" height="27" rx=".8" fill="#fff" opacity=".55" />
                <!-- top + fill opening -->
                <ellipse cx="54" cy="18" rx="18" ry="4.5" fill="url(#fd-can-top)" stroke="#3a4044" stroke-width=".6" />
                <path d="M36.4 18.6A17.6 4.1 0 0 0 71.6 18.6" stroke="#f4f7f9" stroke-width=".7" opacity=".8" />
                <path d="M53.5 16V17.4A6.5 2 0 0 0 66.5 17.4V16Z" fill="url(#fd-can-body)" stroke="#3a4044" stroke-width=".4" />
                <ellipse cx="60" cy="16" rx="6.5" ry="2" fill="#24282b" stroke="#e6ebee" stroke-width=".8" />
                <!-- arched top handle -->
                <path d="M42 18C42 4.5 66 2.5 69 16" stroke="#2f3438" stroke-width="3.6" stroke-linecap="round" />
                <path d="M42 18C42 4.5 66 2.5 69 16" stroke="#9aa3a9" stroke-width="2.2" stroke-linecap="round" />
                <path d="M44.5 11C47 6.5 58 5 63.5 8.5" stroke="#f2f5f7" stroke-width=".7" stroke-linecap="round" />
                <!-- rivets -->
                <g fill="#e8edf0" stroke="#41474c" stroke-width=".3">
                  <circle cx="42" cy="19.6" r=".75" /><circle cx="69" cy="18.6" r=".75" /><circle cx="71" cy="22.4" r=".7" /><circle cx="71" cy="37.6" r=".7" /><circle cx="37.6" cy="41" r=".7" /><circle cx="37.6" cy="46.6" r=".7" />
                </g>
              </svg>
            </span>
            <span class="plant-btn__drops">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            <span class="plant-btn__pot">
              <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="60" cy="118" rx="28" ry="6" fill="rgba(58,36,24,0.28)" />
                <path
                  d="M38 78h44l-6 36c-1 6-7 10-14 10h-4c-7 0-13-4-14-10l-6-36z"
                  fill="#6e4a32"
                  stroke="#3a2418"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
                <path d="M34 78h52v8H34z" fill="#8a6344" stroke="#3a2418" stroke-width="3" />
                <path
                  class="plant-btn__stem"
                  d="M60 78V42"
                  stroke="#3a2418"
                  stroke-width="4"
                  stroke-linecap="round"
                />
                <ellipse
                  class="plant-btn__leaf plant-btn__leaf--l"
                  cx="44"
                  cy="58"
                  rx="14"
                  ry="7"
                  fill="#4a6b32"
                  stroke="#3a2418"
                  stroke-width="2"
                  transform="rotate(-28 44 58)"
                />
                <ellipse
                  class="plant-btn__leaf plant-btn__leaf--r"
                  cx="76"
                  cy="58"
                  rx="14"
                  ry="7"
                  fill="#4a6b32"
                  stroke="#3a2418"
                  stroke-width="2"
                  transform="rotate(28 76 58)"
                />
                <g class="plant-btn__flower">
                  <circle cx="60" cy="18" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="46" cy="28" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="74" cy="28" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="50" cy="42" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="70" cy="42" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="60" cy="32" r="6" fill="#d35400" stroke="#3a2418" stroke-width="2" />
                </g>
                <g class="plant-btn__sparkles">
                  <circle cx="28" cy="30" r="2.5" fill="#f3e6d0" />
                  <circle cx="92" cy="38" r="2" fill="#f3e6d0" />
                  <circle cx="84" cy="18" r="1.8" fill="#f0c14a" />
                </g>
              </svg>
            </span>
          </span>
        </button>

        <p class="water-hint" id="water-hint">Water Me</p>
      </div>

      <a
        class="hero__ig"
        href="https://www.instagram.com/furdle.durt/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="furdle.durt on Instagram"
      >
        <svg
          class="hero__ig-icon"
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="#e87a2a" stroke-width="1.6" />
          <circle cx="12" cy="12" r="4.2" stroke="#e87a2a" stroke-width="1.6" />
          <circle cx="17.2" cy="6.8" r="1.1" class="hero__ig-icon-dot" fill="#e87a2a" stroke="none" />
        </svg>
        <span>furdle.durt</span>
      </a>
    </main>

    <div
      class="modal"
      id="site-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Music, gallery, and merch"
      hidden
    >
      <div class="modal__backdrop" data-close></div>
      <div class="modal__panel modal__panel--site" role="document">
        <button type="button" class="modal__close" data-close aria-label="Close">
          close
        </button>

        <nav class="site-nav" role="tablist" aria-label="Site sections">
          <button
            type="button"
            class="site-nav__btn"
            role="tab"
            data-panel="music"
            aria-selected="false"
            aria-controls="panel-music"
            id="tab-music"
          >
            Music
          </button>
          <button
            type="button"
            class="site-nav__btn"
            role="tab"
            data-panel="gallery"
            aria-selected="false"
            aria-controls="panel-gallery"
            id="tab-gallery"
          >
            Gallery
          </button>
          <button
            type="button"
            class="site-nav__btn is-active"
            role="tab"
            data-panel="merch"
            aria-selected="true"
            aria-controls="panel-merch"
            id="tab-merch"
          >
            Merch
          </button>
        </nav>

        <div class="site-panels">
          <section
            class="site-panel"
            id="panel-music"
            role="tabpanel"
            aria-labelledby="tab-music"
            data-panel-id="music"
            hidden
          >
            <p class="site-panel__soon">Tunes on the way.</p>
          </section>

          <section
            class="site-panel"
            id="panel-gallery"
            role="tabpanel"
            aria-labelledby="tab-gallery"
            data-panel-id="gallery"
            hidden
          >
            <!-- Gallery photos were sourced from the band's public Instagram (@furdle.durt).
                 Live photos (Brooklyn Bowl Las Vegas, Aug 1 2026) are by @paulcitone — keep the credit. -->
            <section class="gallery-group" aria-labelledby="gallery-live-title">
              <h3 class="gallery-group__title" id="gallery-live-title">Live</h3>
              <p class="gallery-group__meta">Brooklyn Bowl Las Vegas · Aug 1 2026 · Photos by <a href="https://www.instagram.com/paulcitone/" target="_blank" rel="noopener">@paulcitone</a></p>
              <div class="gallery-grid">
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-guitar.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-guitar.webp" alt="Guitarist singing on stage at Brooklyn Bowl Las Vegas under purple lights" width="1600" height="1354" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-sax.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-sax.webp" alt="Saxophone player performing at Brooklyn Bowl Las Vegas" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-stage.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-stage.webp" alt="Furdle Durt on stage at Brooklyn Bowl Las Vegas in a swirl of stage light" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-drums.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-drums.webp" alt="Drummer behind the kit at Brooklyn Bowl Las Vegas" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
              </div>
            </section>
            <section class="gallery-group" aria-labelledby="gallery-band-title">
              <h3 class="gallery-group__title" id="gallery-band-title">Band</h3>
              <p class="gallery-group__meta">Photos coming soon.</p>
            </section>
          </section>

          <section
            class="site-panel"
            id="panel-merch"
            role="tabpanel"
            aria-labelledby="tab-merch"
            data-panel-id="merch"
          >
            <article class="merch-item">
              <figure class="merch-item__frame">
                <img
                  class="merch-item__image"
                  src="assets/merch/logo-tee-black.png"
                  alt="Black t-shirt with the Furdle Durt logo and groovy glow"
                  width="1254"
                  height="1254"
                />
              </figure>
              <div class="merch-item__copy">
                <h2 class="merch-item__title">Logo Tee</h2>
                <p class="merch-item__price">$25</p>
                <p class="merch-item__note">Black tee · logo print</p>
                <button type="button" class="merch-item__buy" disabled>
                  Checkout soon
                </button>
              </div>
            </article>
          </section>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
