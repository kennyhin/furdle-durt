          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5" stroke="#e87a2a" stroke-width="1.6" />
          <circle cx="12" cy="12" r="4.2" stroke="#e87a2a" stroke-width="1.6" />
          <circle cx="17.2" cy="6.8" r="1.1" class="hero__ig-icon-dot" fill="#e87a2a" stroke="none" />
        </svg>
        <span>furdle.durt</span>
      </a>
    </main>

    <div
      class="modal"
      id="site-modal"
      role="dialog"
      aria-modal="true"
      aria-label="Music, gallery, and merch"
      hidden
    >
      <div class="modal__backdrop" data-close></div>
      <div class="modal__panel modal__panel--site" role="document">
        <button type="button" class="modal__close" data-close aria-label="Close">
          close
        </button>

        <nav class="site-nav" role="tablist" aria-label="Site sections">
          <button
            type="button"
            class="site-nav__btn"
            role="tab"
            data-panel="music"
            aria-selected="false"
            aria-controls="panel-music"
            id="tab-music"
          >
            Music
          </button>
          <button
            type="button"
            class="site-nav__btn"
            role="tab"
            data-panel="gallery"
            aria-selected="false"
            aria-controls="panel-gallery"
            id="tab-gallery"
          >
            Gallery
          </button>
          <button
            type="button"
            class="site-nav__btn is-active"
            role="tab"
            data-panel="merch"
            aria-selected="true"
            aria-controls="panel-merch"
            id="tab-merch"
          >
            Merch
          </button>
        </nav>

        <div class="site-panels">
          <section
            class="site-panel"
            id="panel-music"
            role="tabpanel"
            aria-labelledby="tab-music"
            data-panel-id="music"
            hidden
          >
            <p class="site-panel__soon">Tunes on the way.</p>
          </section>

          <section
            class="site-panel"
            id="panel-gallery"
            role="tabpanel"
            aria-labelledby="tab-gallery"
            data-panel-id="gallery"
            hidden
          >
            <!-- Gallery photos were sourced from the band's public Instagram (@furdle.durt).
                 Live photos (Brooklyn Bowl Las Vegas, Aug 1 2026) are by @paulcitone — keep the credit. -->
            <section class="gallery-group" aria-labelledby="gallery-live-title">
              <h3 class="gallery-group__title" id="gallery-live-title">Live</h3>
              <p class="gallery-group__meta">Brooklyn Bowl Las Vegas · Aug 1 2026 · Photos by <a href="https://www.instagram.com/paulcitone/" target="_blank" rel="noopener">@paulcitone</a></p>
              <div class="gallery-grid">
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-guitar.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-guitar.webp" alt="Guitarist singing on stage at Brooklyn Bowl Las Vegas under purple lights" width="1600" height="1354" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-sax.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-sax.webp" alt="Saxophone player performing at Brooklyn Bowl Las Vegas" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-stage.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-stage.webp" alt="Furdle Durt on stage at Brooklyn Bowl Las Vegas in a swirl of stage light" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
                <figure class="gallery-item">
                  <a href="assets/gallery/photos/live-brooklyn-bowl-aug-2026-drums.webp" target="_blank" rel="noopener">
                    <img class="gallery-item__image" src="assets/gallery/photos/live-brooklyn-bowl-aug-2026-drums.webp" alt="Drummer behind the kit at Brooklyn Bowl Las Vegas" width="1080" height="914" loading="lazy" decoding="async">
                  </a>
                </figure>
              </div>
            </section>
            <section class="gallery-group" aria-labelledby="gallery-band-title">
              <h3 class="gallery-group__title" id="gallery-band-title">Band</h3>
              <p class="gallery-group__meta">Photos coming soon.</p>
            </section>
          </section>

          <section
            class="site-panel"
            id="panel-merch"
            role="tabpanel"
            aria-labelledby="tab-merch"
            data-panel-id="merch"
          >
            <article class="merch-item">
              <figure class="merch-item__frame">
                <img
                  class="merch-item__image"
                  src="assets/merch/logo-tee-black.png"
                  alt="Black t-shirt with the Furdle Durt logo and groovy glow"
                  width="1254"
                  height="1254"
                />
              </figure>
              <div class="merch-item__copy">
                <h2 class="merch-item__title">Logo Tee</h2>
                <p class="merch-item__price">$25</p>
                <p class="merch-item__note">Black tee · logo print</p>
                <button type="button" class="merch-item__buy" disabled>
                  Checkout soon
                </button>
              </div>
            </article>
          </section>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
