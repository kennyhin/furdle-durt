<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>furdle durt — organic rock</title>
    <meta
      name="description"
      content="furdle durt — organic rock. Upcoming shows."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Coiny&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="assets/gallery/logo-circle.png" type="image/png" />
  </head>
  <body>
    <main class="hero" id="top">
      <div class="hero__content">
        <p class="hero__eyebrow">organic rock</p>
        <h1 class="hero__title">
          <span>furdle</span>
          <span>durt</span>
        </h1>

        <button
          type="button"
          class="plant-btn"
          id="plant-btn"
          aria-haspopup="dialog"
          aria-controls="shows-modal"
          aria-label="Water the plant to see upcoming shows"
          aria-describedby="water-hint"
        >
          <span class="plant-btn__scene" aria-hidden="true">
            <span class="plant-btn__can">
              <svg viewBox="0 0 64 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M14 20h28c4 0 7 3 7 7v2H18c-3 0-5-2-5-5v-4z"
                  fill="#7a8f5c"
                  stroke="#3a2418"
                  stroke-width="2"
                />
                <path
                  d="M42 24c6 1 12-2 16-8"
                  stroke="#3a2418"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <ellipse
                  cx="28"
                  cy="18"
                  rx="10"
                  ry="4"
                  fill="#9aaf78"
                  stroke="#3a2418"
                  stroke-width="2"
                />
              </svg>
            </span>
            <span class="plant-btn__drops">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
            <span class="plant-btn__pot">
              <svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="60" cy="118" rx="28" ry="6" fill="rgba(58,36,24,0.28)" />
                <path
                  d="M38 78h44l-6 36c-1 6-7 10-14 10h-4c-7 0-13-4-14-10l-6-36z"
                  fill="#6e4a32"
                  stroke="#3a2418"
                  stroke-width="3"
                  stroke-linejoin="round"
                />
                <path d="M34 78h52v8H34z" fill="#8a6344" stroke="#3a2418" stroke-width="3" />
                <path
                  class="plant-btn__stem"
                  d="M60 78V42"
                  stroke="#3a2418"
                  stroke-width="4"
                  stroke-linecap="round"
                />
                <ellipse
                  class="plant-btn__leaf plant-btn__leaf--l"
                  cx="44"
                  cy="58"
                  rx="14"
                  ry="7"
                  fill="#4a6b32"
                  stroke="#3a2418"
                  stroke-width="2"
                  transform="rotate(-28 44 58)"
                />
                <ellipse
                  class="plant-btn__leaf plant-btn__leaf--r"
                  cx="76"
                  cy="58"
                  rx="14"
                  ry="7"
                  fill="#4a6b32"
                  stroke="#3a2418"
                  stroke-width="2"
                  transform="rotate(28 76 58)"
                />
                <g class="plant-btn__flower">
                  <circle cx="60" cy="18" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="46" cy="28" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="74" cy="28" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="50" cy="42" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="70" cy="42" r="9" fill="#f0c14a" stroke="#3a2418" stroke-width="2" />
                  <circle cx="60" cy="32" r="6" fill="#d35400" stroke="#3a2418" stroke-width="2" />
                </g>
                <g class="plant-btn__sparkles">
                  <circle cx="28" cy="30" r="2.5" fill="#f3e6d0" />
                  <circle cx="92" cy="38" r="2" fill="#f3e6d0" />
                  <circle cx="84" cy="18" r="1.8" fill="#f0c14a" />
                </g>
              </svg>
            </span>
          </span>
        </button>

        <p class="water-hint" id="water-hint">Water Me</p>
      </div>
    </main>

    <div
      class="modal"
      id="shows-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="shows-title"
      hidden
    >
      <div class="modal__backdrop" data-close></div>
      <div class="modal__panel" role="document">
        <button type="button" class="modal__close" data-close aria-label="Close">
          close
        </button>
        <h2 id="shows-title" class="modal__title">Upcoming shows</h2>
        <img
          class="modal__poster"
          src="assets/gallery/show-poster.jpg"
          alt="Furdle Durt at Brooklyn Bowl Las Vegas — Saturday, August 1, 2026, 7:00 P.M., opening for Red Eye Gin"
        />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
